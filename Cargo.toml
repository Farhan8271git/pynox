[package]
name = "pynox"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "A Python runtime with explicit permissions and native optimizations"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
landlock = "0.4.7"
libc = "0.2"
pyo3-ffi = "=0.29.3"
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde_json = "1"

[profile.release]
strip = true
lto = "thin"

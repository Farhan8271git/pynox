name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: Features
    labels: [feature, enhancement]
  - title: Performance
    labels: [performance]
  - title: Fixes
    labels: [bug, fix]
  - title: Documentation
    labels: [documentation, docs]
  - title: Maintenance
    labels: [chore, dependencies, ci]
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [bug, fix, documentation, dependencies]
  default: patch
template: |
  ## Changes

  $CHANGES
